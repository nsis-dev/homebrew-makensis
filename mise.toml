[tools]
ruby = "3.4"
actionlint = "latest"
hk = "1.56.1"
pkl = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.style]
description = "Lint formulae (RuboCop via brew)"
run = "brew style ./Formula"

[tasks.audit]
description = "Audit all formulae like CI does"
run = """
set -e
brew tap nsis-dev/makensis
for file in ./Formula/*.rb; do
  name=$(basename "${file%.rb}")
  echo "==> Auditing formula $name"
  brew audit --formula --online --strict "nsis-dev/makensis/$name"
done
"""

[tasks.test]
description = "Install and test the latest formula (destructive: installs packages)"
# ponytail: latest only; every makensis@ installs the same bin/makensis and old ones may not build
run = """
set -e
name=$(ls Formula | sort -V | tail -n1)
name=${name%.rb}
echo "==> Installing $name"
brew install --formula --build-from-source "nsis-dev/makensis/$name"
echo "==> Testing $name"
brew test "$name"
"""

[tasks.ci]
description = "Everything CI runs, minus the installs"
depends = ["style", "audit"]
